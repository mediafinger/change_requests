name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

# Two jobs, not seven.
#
# The checks from PLAN.md §15.6 were one job each, which read well on a green run and badly on a
# real one: GitHub queues them, and seven runners each spend fifteen to twenty seconds on checkout
# and `bundle install` before doing fifteen seconds of actual work. The setup dominated.
#
# They are grouped by the only thing that genuinely differs between them - whether they need
# PostgreSQL - because that is what decides whether a job has to wait for a service container.
#
# Nothing was given up to do this. Every check is still its own `rake` task, and every `rake` task
# still runs in its own process: `RSpec::Core::RakeTask` shells out to a fresh `ruby … rspec`. That
# matters most for `headless`, whose whole claim is that Rails is never loaded - it is as isolated
# as a step of this job as it was as a job of its own, because the isolation was never the job's
# doing.
#
# `if: ${{ !cancelled() }}` keeps the failure overview the separate jobs gave: one failing check no
# longer hides the four after it, so a red run still says which checks passed.
jobs:
  checks:
    runs-on: ubuntu-latest
    name: Checks

    # Deliberately no database. Linting, architecture, security, packaging and the dependency audit
    # never needed one, and saying so here keeps it true.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rake rubocop

      # PLAN.md §1 and §2 as executable rules - see Archspec.rb. This is §15.5's static half: the
      # headless spec proves the core *runs* without Rails, this proves it cannot quietly acquire a
      # dependency on it.
      - name: Architecture
        if: ${{ !cancelled() }}
        run: bundle exec rake archspec

      # Brakeman needs --force-scan on a gem - see the Rakefile for why the gem root beats
      # spec/dummy as a target.
      - name: Security
        if: ${{ !cancelled() }}
        run: bundle exec rake brakeman

      # §15.4. The only check that would catch a directory renamed out of `spec.files`, which
      # otherwise surfaces as an adopter's failed `rails g change_requests:install`.
      - name: Packaging
        if: ${{ !cancelled() }}
        run: bundle exec rake packaging

      - name: Bundler audit
        if: ${{ !cancelled() }}
        run: bundle exec rake bundle:audit

  specs:
    runs-on: ubuntu-latest
    name: Specs / Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0.6'
        gemfile:
          - gemfiles/rails_8.1.gemfile

    # PostgreSQL only, deliberately: no sqlite fallback and no second adapter to keep working
    # (PLAN.md §18). There is no second schema job either - every gem-owned key is a uuid and
    # nothing else (§19.11), so there is no alternative migration shape to prove.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: change_requests_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Prepare the dummy application's database
        run: bundle exec rake dummy:db:prepare

      # §15.5's runtime half, first and in its own process: the domain core loads, connects and runs
      # with Rails never required. It needs PostgreSQL because the point is a *bare ActiveRecord
      # connection* - no database.yml, no Rails.application.
      - name: Headless core
        if: ${{ !cancelled() }}
        run: bundle exec rake headless

      - name: RSpec
        if: ${{ !cancelled() }}
        run: bundle exec rake rspec

  # The job §15.6 calls "the test that catches everything the dummy app's `path:` dependency hides":
  # generate a throwaway Rails app, run `change_requests:install`, run the migrations, boot it.
  #
  # It earns a job of its own rather than a step, because it is the one check that must *not* run
  # against this repository's bundle. It has nothing to run until M7 writes the generators, and a job
  # that vacuously passes is worse than no job, so it waits here rather than pretending.
  #
  # generators-on-a-real-app:
  #   runs-on: ubuntu-latest
  #   name: Generators on a real app
  #   steps:
  #     - run: bundle exec rake generators:on_a_real_app
