name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

# The jobs from PLAN.md §15.6, split so a failure names itself: "rubocop" and "rspec" fail for very
# different reasons, and finding out which took the run is not a job for the log viewer.
#
# Only the jobs that touch the dummy application or a live connection need PostgreSQL - rspec and
# the headless core. The other five deliberately run without a database, which is a small proof in
# itself: linting, architecture, security and packaging never needed one.
jobs:
  rubocop:
    runs-on: ubuntu-latest
    name: RuboCop

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: bundle exec rake rubocop

  rspec:
    runs-on: ubuntu-latest
    name: RSpec / Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0.6'
        gemfile:
          - gemfiles/rails_8.1.gemfile

    # PostgreSQL only, deliberately: no sqlite fallback and no second adapter to keep working
    # (PLAN.md §18). There is no second schema job either - every gem-owned key is a uuid and
    # nothing else (§19.11), so there is no alternative migration shape to prove.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: change_requests_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Prepare the dummy application's database
        run: bundle exec rake dummy:db:prepare
      - run: bundle exec rake rspec

  audit:
    runs-on: ubuntu-latest
    name: Bundler audit

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: bundle exec rake bundle:audit

  archspec:
    runs-on: ubuntu-latest
    name: Architecture

    # PLAN.md §1 and §2 as executable rules - see Archspec.rb. It parses rather than boots, so it
    # needs neither a database nor the dummy application, and it is the static half of §15.5: the
    # headless job below proves the core *runs* without Rails, this proves it cannot quietly acquire
    # a dependency on it.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: bundle exec rake archspec

  brakeman:
    runs-on: ubuntu-latest
    name: Security

    # Brakeman expects a Rails application; this is a gem, so `--force-scan` is what makes it scan at
    # all. It does reach lib/, which is where every line of the gem lives - see the Rakefile for why
    # the gem root beats spec/dummy, why --add-engines-path and --add-libs-path add nothing here,
    # and why this gets more useful at M2, M3 and M6 rather than less.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: bundle exec rake brakeman

  headless:
    runs-on: ubuntu-latest
    name: Headless core

    # §15.5's runtime half. Its own job rather than only a spec inside the suite: run alone, the
    # parent process never loads Rails either, so it cannot pass for the wrong reason. It needs
    # PostgreSQL because the point is a *bare ActiveRecord connection* - no database.yml, no
    # Rails.application. The static half is the Architecture job above.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: change_requests_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: bundle exec rake headless

  packaging:
    runs-on: ubuntu-latest
    name: Packaging

    # §15.4. Reads the gemspec, so it needs neither a database nor the dummy application. It is the
    # only job that would catch a directory renamed out of `spec.files`, which otherwise surfaces as
    # an adopter's failed `rails g change_requests:install`.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: bundle exec rake packaging

  # The job §15.6 calls "the test that catches everything the dummy app's `path:` dependency hides":
  # generate a throwaway Rails app, run `change_requests:install`, run the migrations, boot it.
  #
  # It has nothing to run until M7 writes the generators, and a job that vacuously passes is worse
  # than no job, so it waits here rather than pretending.
  #
  # generators-on-a-real-app:
  #   runs-on: ubuntu-latest
  #   name: Generators on a real app
  #   steps:
  #     - run: bundle exec rake generators:on_a_real_app
